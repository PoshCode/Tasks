# https://gitversion.net/docs/reference/configuration
workflow: GitFlow/v1
mode: ContinuousDelivery
increment: Minor
strategies:
- TaggedCommit
- TrackReleaseBranches
- VersionInBranchName
branches:
  main:
    regex: ^production$
  develop:
    regex: ^main$
    label: "beta"
  release:
    label: rc
    mode: ContinuousDelivery
  hotfix:
    label: rc
    mode: ContinuousDelivery
  pull-request:
    regex: ^pull/(?<Number>[^/-]+)/merge$
    label: apr.{Number}.c
    track-merge-target: true
  feature:
    regex: ^feat(ure)?/[^\d]*(?<Number>\d+)?.*?$
    mode: ContinuousDelivery
    label: alpha.{Number}.c
